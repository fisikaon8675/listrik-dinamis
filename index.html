<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroQuest 3D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Container untuk memuat Dunia 3D -->
    <div id="game-container"></div>

    <!-- UI Overlay (Muncul saat pemain menekan "E" di dekat NPC/Generator) -->
    <div id="ui-layer" class="hidden">
        <div class="modal">
            <h2 id="npc-name">Nama NPC</h2>
            
            <div id="materi-content"></div>
            <div id="challenge-content" class="hidden"></div>
            
            <button id="btn-next">Lanjut ke Tantangan</button>
            <button id="btn-close">Tutup</button>
        </div>
    </div>

    <!-- 1. IMPORT CORE THREE.JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- 2. IMPORT GLTFLOADER (Ini yang akan memperbaiki error Anda!) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <!-- 3. SCRIPT GAME KITA -->
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
